<div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-4">
  <div *ngIf="pokemon" class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-4">
      <h1 class="text-2xl font-bold text-blue-900">Pokémon Detail</h1>
    </div>

    <!-- Detail Card -->
    <div class="bg-white rounded-2xl shadow-xl p-4">
      <h2 class="text-2xl font-bold mb-3 text-center capitalize text-blue-900">{{ pokemon.name }}</h2>

      <div class="flex flex-col items-center">
        <div class="flex items-center gap-4 mb-3">
          <button (click)="irAnterior()" [disabled]="!pokemonId || pokemonId <= 1"
                  class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 disabled:from-gray-400 disabled:to-gray-500 text-white font-bold py-2 px-4 rounded-lg text-sm shadow-lg transform transition hover:scale-105 disabled:cursor-not-allowed">
            Anterior
          </button>
          <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name" class="w-32 h-32 drop-shadow-lg">
          <button (click)="irSiguiente()"
                  class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-2 px-4 rounded-lg text-sm shadow-lg transform transition hover:scale-105">
            Siguiente 
          </button>
        </div>

        <!-- Types -->
        <div class="flex flex-wrap justify-center gap-1 mb-3">
          <span *ngFor="let type of pokemon.types"
                [class]="utilitiesService.getTypeColor(type.type.name) + ' px-2 py-1 rounded-full text-xs font-semibold capitalize shadow'">
            {{ type.type.name }}
          </span>
        </div>

        <!-- Weight -->
        <div class="px-2 py-0.5 rounded-lg bg-blue-100 border-2 border-blue-300 mb-3 font-semibold text-xs text-blue-900">
          Weight: {{ formatearPeso(pokemon.weight) }}Kg
        </div>

        <!-- Abilities -->
        <div class="w-full flex flex-col items-center mb-3">
          <h3 class="text-sm font-bold mb-1 text-blue-900">Abilities</h3>
          <div class="flex flex-row flex-wrap justify-center gap-1">
            <span *ngFor="let ability of pokemon.abilities" class="px-2 py-1 bg-blue-100 border-2 border-blue-300 rounded-lg text-xs font-semibold capitalize text-blue-900">
              {{ ability.ability.name }}
            </span>
          </div>
        </div>

        <!-- Stats -->
        <div class="w-full bg-blue-50 rounded-lg p-2">
          <h3 class="text-sm font-bold mb-2 text-blue-900">Stats</h3>
          <ul class="space-y-2">
            <li *ngFor="let stat of pokemon.stats" class="flex items-center gap-2 text-xs">
              <span class="w-28 capitalize font-semibold text-blue-900">{{ stat.stat.name }}:</span>
              <span class="w-10 text-right font-bold text-blue-900">{{ stat.base_stat }}</span>
              <div class="flex-1 h-4 bg-gray-200 rounded-full overflow-hidden">
                <div [style.width.%]="(stat.base_stat / 255) * 100" [class]="utilitiesService.obtenerColorStat(stat.stat.name) + ' h-full rounded-full transition-all duration-500'"></div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
