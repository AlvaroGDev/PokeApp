<div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-6">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-900 mb-2">Search Pokémon</h1>
      <p class="text-blue-700">Find any Pokémon by name</p>
    </div>

    <!-- Search Input -->
    <div class="mb-6">
      <input type="text" class="w-full border-2 border-blue-500 p-3 rounded-lg focus:outline-none focus:border-blue-700 bg-white font-semibold text-blue-900 placeholder-gray-400" [(ngModel)]="filtro" (input)="filtrarPokemon(filtro)" placeholder="Search Pokémon by name..." />
    </div>

    <!-- Results -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div *ngIf="pokemonFiltrado.length > 0">
        <div *ngFor="let pokemon of pokemonFiltrado" class="border-b border-gray-200 p-4 cursor-pointer hover:bg-blue-50 transition flex items-center gap-4"
        (click)="verDetalle(pokemon.id)">
          <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name" class="w-12 h-12">
          <span class="font-semibold text-blue-900">#{{ pokemon.id }} {{ pokemon.name | uppercase }}</span>
        </div>
      </div>
      <div *ngIf="pokemonFiltrado.length === 0 && filtro !== ''" class="p-8 text-center text-gray-500">
        No Pokémon found matching "{{ filtro }}"
      </div>
      <div *ngIf="filtro === ''" class="p-8 text-center text-gray-400">
        Start typing to search for Pokémon
      </div>
    </div>
  </div>
</div>
