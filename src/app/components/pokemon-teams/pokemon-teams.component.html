<div class="p-6">
  <h2 class="text-3xl font-bold mb-6">Equipos Guardados</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let team of teamList" 
         class="bg-white rounded-lg border-2 border-gray-200 p-4">
      <h3 class="text-xl font-bold mb-3 text-center">{{ team.name }}</h3>
      
      <div class="grid grid-cols-2 gap-2">
        <div *ngFor="let pokemon of team.pokemons" class="text-center">
          <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name" 
               class="w-16 h-16 mx-auto">
          <p class="text-sm capitalize mt-1">{{ pokemon.name }}</p>
          <div class="flex justify-center gap-1 mt-1">
            <span *ngFor="let type of pokemon.types" 
                  class="px-2 py-1 bg-gray-200 rounded text-xs capitalize">
              {{ type.type.name }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="teamList.length === 0" class="text-center text-gray-500 mt-8">
    No hay equipos guardados todavía
  </div>
</div>
