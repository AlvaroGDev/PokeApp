<div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-900 mb-2">Saved Teams</h1>
      <p class="text-blue-700">Your Pokémon teams collection</p>
    </div>

    <!-- Teams Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let team of teamList" 
           class="bg-white rounded-2xl shadow-lg border-2 border-blue-200 p-4 hover:shadow-xl transition">
        <h3 class="text-lg font-bold mb-4 text-center text-blue-900 capitalize">{{ team.name }}</h3>
        
        <!-- Team Members Grid -->
        <div class="grid grid-cols-3 gap-2 mb-4">
          <div *ngFor="let pokemon of team.pokemons" class="bg-blue-50 rounded-lg border border-blue-300 p-2 text-center hover:bg-blue-100 transition">
            <img  [src]="pokemon.sprites.front_default" [alt]="pokemon.name" 
                 class="w-16 h-16 mx-auto cursor-pointer hover:opacity-70 transition"
                 (click)="goToPokemonDetail(pokemon.id)">
            <p class="text-xs capitalize mt-1 font-semibold text-blue-900 line-clamp-1">{{ pokemon.name }}</p>
            <div class="flex justify-center gap-0.5 mt-1 flex-wrap">
              <span *ngFor="let type of pokemon.types" 
                    [class]="utilitiesService.getTypeColor(type.type.name) 
                    + ' px-1 py-0.5 rounded text-xs capitalize'">
                {{ type.type.name }}
              </span>
            </div>
          </div>
        </div>

        <!-- Delete Button -->
        <div class="flex justify-center">
          <button class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold py-2 px-6 rounded-lg text-sm shadow-lg transform transition hover:scale-105" 
          (click)="eliminarEquipo(team.id)">Delete</button>
        </div>  
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="teamList.length === 0" class="text-center mt-8">
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <p class="text-gray-500 text-lg">No saved teams yet</p>
        <p class="text-gray-400 text-sm mt-2">Create your first team in the Team Builder</p>
      </div>
    </div>
  </div>
</div>
