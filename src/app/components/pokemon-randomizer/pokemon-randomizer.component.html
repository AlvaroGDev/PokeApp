<div class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-4">
  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-3xl font-bold text-blue-900 mb-1">Pokémon Team Builder</h1>
    <p class="text-blue-700 text-sm">Create your perfect team of 6 Pokémon</p>
  </div>

  <!-- Main Container -->
  <div class="grid grid-cols-3 gap-4 max-w-7xl mx-auto">
    
    <!-- Left Column: Type Selector & Randomize -->
    <div class="col-span-1 flex flex-col gap-4">
      <div class="bg-white rounded-2xl shadow-lg p-4">
        <label class="block text-sm font-bold text-blue-900 mb-2">Filter by Type</label>
        <select [(ngModel)]="selectedType" class="w-full px-3 py-2 border-2 border-blue-500 rounded-lg focus:outline-none focus:border-blue-700 bg-white font-semibold text-blue-900 cursor-pointer hover:border-blue-600">
          <option value="">Any Type</option>
          <option *ngFor="let type of POKEMON_TYPE_NAMES" [value]="type" class="capitalize">{{ type }}</option>
        </select>
      </div>

      <button class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition hover:scale-105"
        (click)="onRandomize()">
        Randomize
      </button>
    </div>

    <!-- Center Column: Current Pokémon -->
    <div class="col-span-1">
      <ng-container *ngIf="pokemon">
        <div class="bg-white rounded-2xl shadow-xl p-4 h-full flex flex-col">
          <h2 class="text-2xl font-bold text-center capitalize text-blue-900 mb-3">{{ pokemon.name }}</h2>
          <div class="flex flex-col items-center flex-grow justify-between">
            <img [src]="pokemon.sprites.front_default" alt="{{ pokemon.name }}" class="w-32 h-32 drop-shadow-lg" />
            
            <!-- Types -->
            <div class="flex flex-wrap justify-center gap-2 my-3 w-full">
              <span *ngFor="let type of pokemon.types" [class]="utilitiesService.getTypeColor(type.type.name) + ' px-2 py-1 rounded-full text-xs font-semibold capitalize shadow'">
                {{ type.type.name }}
              </span>
            </div>

            <!-- Add Button -->
            <button (click)="anadirPokemon(pokemon)"
              class="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transform transition hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed text-sm"
              [disabled]="equipoPokemon.length >= 6">
              Add to Team ({{ equipoPokemon.length }}/6)
            </button>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Right Column: Current Team -->
    <div class="col-span-1">
      <div class="bg-white rounded-2xl shadow-lg p-4 min-h-[400px]">
        <h3 class="text-lg font-bold text-blue-900 mb-3 text-center">Your Team ({{ equipoPokemon.length }}/6)</h3>
        <div class="grid grid-cols-3 gap-2">
          <div *ngFor="let pokemon of equipoPokemon"
            class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg border-2 border-blue-300 p-2 text-center flex flex-col items-center justify-between hover:shadow-md transition">
            <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name" class="w-16 h-16">
            <h4 class="font-bold capitalize text-xs text-blue-900 mt-1 line-clamp-1">{{ pokemon.name }}</h4>
            <button (click)="eliminarPokemon(equipoPokemon.indexOf(pokemon))"
              class="bg-red-500 hover:bg-red-600 text-white font-bold py-0.5 px-2 rounded-full text-xs transition transform hover:scale-110 mt-1">
              X
            </button>
          </div>
          <!-- Empty slots -->
          <div *ngFor="let empty of [].constructor(6 - equipoPokemon.length)"
            class="bg-gray-100 rounded-lg border-2 border-dashed border-gray-300 p-2 flex items-center justify-center">
            <span class="text-gray-400 text-2xl">+</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Save Team Form (Full Width Below) -->
  <ng-container *ngIf="equipoPokemon.length == 6">
    <div class="max-w-7xl mx-auto mt-4 flex justify-center">
      <div class="bg-white rounded-2xl shadow-lg p-4 border-2 border-yellow-300 w-full max-w-2xl">
        <div class="flex gap-3 items-end">
          <div class="flex-1">
            <label class="block text-sm font-bold text-blue-900 mb-2">Team Name</label>
            <input type="text" [(ngModel)]="team.name" placeholder="Enter team name..." class="w-full border-2 border-blue-300 p-2 rounded-lg focus:outline-none focus:border-blue-500 font-semibold" />
          </div>
          <button class="w-48 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transform transition hover:scale-105"
            (click)="guardarEquipo(team.name, equipoPokemon)">
            Save Team
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Saved Teams (Full Width Below) -->
  <div class="max-w-7xl mx-auto mt-6" *ngIf="teamList.length > 0">
    <h2 class="text-2xl font-bold text-blue-900 mb-4 text-center">Your Saved Teams</h2>
    <div class="grid grid-cols-1 gap-4">
      <div *ngFor="let team of teamList" class="bg-white rounded-2xl shadow-lg p-4 border-2 border-blue-200 hover:shadow-xl transition">
        <h4 class="font-bold text-lg text-center text-blue-900 mb-4 capitalize">{{ team.name }}</h4>
        <div class="grid grid-cols-6 gap-3">
          <div *ngFor="let pokemon of team.pokemons" class="bg-blue-50 rounded-lg border border-blue-300 p-2 text-center hover:shadow-md transition">
            <img [src]="pokemon.sprites.front_default" alt="{{pokemon.name}}" class="w-14 h-14 mx-auto mb-1">
            <div class="capitalize text-xs font-semibold text-blue-900 line-clamp-1">{{ pokemon.name }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
